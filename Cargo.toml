[package]
name = "roblox_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.25", features = ["cookies", "json", "rustls-tls"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
dotenvy = "0.15.7"
serde_json = "1.0.143"
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.29"
