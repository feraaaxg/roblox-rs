[package]
name = "roblox_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.25", features = ["cookies", "json", "rustls-tls"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
dotenvy = "0.15.7"
serde_json = "1.0.143"
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11"
open = "5.0"
rand = "0.9.2"
urlencoding = "2.1"
lazy_static = "1.5.0"
regex = "1.12.2"
once_cell = "1.21.3"
whoami = "1.6.1"
bon = "3.8.1"
sysinfo = "0.37.2"
chrono = { version = "0.4.42", features = ["serde"] }
ansi_term = "0.12.1"
